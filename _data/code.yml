# =====================================================================
#  CODE — one entry per GitHub repository.
#  `repo` is "owner/name"; the link is built automatically.
#  `status: planned` shows the entry without a link.
# =====================================================================

- name: Mind-the-Gap-PII
  repo: Adeelzafar/Mind-the-Gap-PII
  status: available
  description: >-
    Stress-test benchmark and evaluation code for PII detection systems under
    realistic distribution shift. Evaluates encoder-based (spaCy), rule-based
    hybrid (Microsoft Presidio) and LLM-based (Qwen2.5-3B-Instruct) detectors
    across seven categories of shift, with scripts to regenerate the
    benchmark and the paper's figures.
  language: Python (scripts and Jupyter notebooks)
  licence: MIT
  paper: zafar2026mindthegap

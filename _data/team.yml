  bio: |                               # leave a blank line between paragraphs
    I am a postdoctoral researcher in machine learning at the School of
    Information Technology, Halmstad University, where I lead the PrivNLP
    research line. My work centres on natural language processing, large
    language models and AI security.

    Before Halmstad, I built named entity recognition systems for LLM policy
    compliance and led red-teaming of LLM and retrieval-augmented systems in
    industry. Earlier I was an associate professor and head of department at
    Riphah International University, and a research fellow at NYU Tandon.

- id: planted-patients
  name: Planted-Patient Clinical Leakage Dataset
  status: planned                  # available | planned
  release_note: Released together with the paper on acceptance.
  synthetic: true
  synthetic_note: >-
    Every patient, identifier and record in this dataset is fictional. The
    clinical notes come from Asclepius, which consists of synthetic notes,
    and the planted patients were generated programmatically. No real
    patient data is included.
  description: >-
    Clinical notes with synthetic patients planted into them, split into
    training members and held-out non-members, for measuring memorization,
    patient–condition leakage and membership inference in fine-tuned
    clinical language models.

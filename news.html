---
layout: page
title: News
permalink: /news/
prose: false
---
<ul class="news-list news-list-full">
{%- for post in site.posts %}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %B %Y" }}</time>
    <div>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <p>{{ post.excerpt | strip_html | strip | truncatewords: 40 }}</p>
    </div>
  </li>
{%- endfor %}
</ul>
<p><a href="{{ '/news/feed.xml' | relative_url }}">Subscribe with RSS</a></p>

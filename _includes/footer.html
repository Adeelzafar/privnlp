<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-meta">
      {{ site.title }}, {{ site.author.affiliation }}.
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
    </p>
    {% include profile-links.html %}
    <p class="footer-small">
      This site sets no cookies{% if site.goatcounter != "" %} and counts visits with GoatCounter, which stores no personal data{% endif %}.
      <a href="{{ '/news/feed.xml' | relative_url }}">News feed (RSS)</a>
    </p>
  </div>
</footer>

---
layout: default
---
<div class="wrap">
  <article class="post">
    <header class="page-head">
      <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
      <h1>{{ page.title }}</h1>
    </header>
    <div class="prose">
      {{ content }}
    </div>
    <p class="back-link"><a href="{{ '/news/' | relative_url }}">All news</a></p>
  </article>
</div>
